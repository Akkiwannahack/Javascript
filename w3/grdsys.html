<!DOCTYPE html>
<html>

<head>
    <title> Student Grading System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        h2 {
            color: red;
        }
        form {
            margin: 0 auto;
            width: max-content;
            text-align: left;
        }
        input[type="text"], input[type="number"], input[type="button"] {
            margin-top: 5px;
            margin-bottom: 15px;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        .report-card {
            display: none;
            margin: 20px auto 0 auto;
            text-align: left;
            width: max-content;
        }
    </style>
</head>

<body>

    <h2> Student Grading System</h2>

    <form>
        <label>Student Name:</label>
        <input type="text" id="name">

        <label>Marks: </label>
        <input type="number" id="marks">

        <input type="button" value="Calculate Grade" onclick="GradeSystem()">
    </form>

    <div id="report" class="report-card"></div>

    <script>
        function GradeSystem() {
            var name = document.getElementById("name").value;
            var marks = document.getElementById("marks").value;


            if (name == "") {
                alert("Please enter Student Name");
                return;
            }

            if (marks == "") {
                alert("Please enter marks");
                return;
            }

            marks = Number(marks);
            if (marks < 0 || marks > 100) {
                alert("Invalid marks");
                return;
            }

            var grade;
            var result;
            if (marks >= 90) {
                grade = "A+";
                result = "Pass";
            }
            else if (marks >= 80) {
                grade = "A";
                result = "PASS";
            }
            else if (marks >= 70) {
                grade = "B";
                result = "PASS";
            }
            else if (marks >= 60) {
                grade = "C";
                result = " Pass";
            }
            else if (marks >= 50) {
                grade = "D";
                result = "Pass";
            }
            else if (marks >= 40) {
                grade = "E";
                result = "Fail";
            }
            else {
                grade = "F";
                result = "Fail";
            }


            var reportDiv = document.getElementById("report");
            reportDiv.innerHTML = "<h2>Student Grade Report</h2>" +
                                  "<hr>" +
                                  "<b>Student Name :</b> " + name + "<br><br>" +
                                  "<b>Marks :</b> " + marks + "<br><br>" +
                                  "<b>Grade :</b> " + grade + "<br><br>" +
                                  "<b>Result :</b> " + result;
            reportDiv.style.display = "block";
        }
    </script>
</body>

</html>
