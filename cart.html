<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMI - Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-left">
            <img src="images/logo.jfif" alt="LUMI Logo" class="nav-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\'><rect width=\'40\' height=\'40\' fill=\'%232563EB\'/><text x=\'50%\' y=\'50%\' font-family=\'sans-serif\' font-size=\'20\' fill=\'white\' text-anchor=\'middle\' dominant-baseline=\'middle\'>L</text></svg>'">
            <span class="nav-title">LUMI</span>
        </a>
        <div class="nav-right">
            <a href="cart.html" class="cart-link">
                <span>🛒 Cart</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container cart-container">
        <h2>Your Cart</h2>
        <div id="cartItemsContainer">
            <!-- Cart items will be injected here -->
        </div>
        
        <div class="cart-summary" id="cartSummary" style="display: none;">
            <h3>Order Summary</h3>
            <div class="grand-total">Total: ₹<span id="cartTotal">0</span></div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </main>

    <script src="js/cart.js"></script>
</body>
</html>
