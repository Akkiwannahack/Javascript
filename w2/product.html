<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Billing Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .calculator-card {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            border-top: 2px dashed #000;
            padding-top: 10px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .bold {
            font-weight: bold;
        }
        h2, h3 {
            margin-top: 0;
        }
        hr {
            border: 0;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="calculator-card">
        <h2>Billing Calculator</h2>
        <form id="priceForm">
            <div class="form-group">
                <label for="customerName">Customer Name:</label>
                <input type="text" id="customerName" required>
            </div>
            <div id="cartPreview" style="margin-bottom: 10px; font-size: 14px;"></div>
            <button type="submit">Calculate Bill</button>
        </form>

        <div class="result" id="resultCard">
            <h3>Invoice</h3>
            <div class="receipt-row">
                <span>Order ID:</span>
                <span id="displayOrderId" class="bold"></span>
            </div>
            <div class="receipt-row">
                <span>Date:</span>
                <span id="displayDate" class="bold"></span>
            </div>
            <div class="receipt-row">
                <span>Customer:</span>
                <span id="displayCustomerName" class="bold"></span>
            </div>
            <hr>
            <div id="invoiceItems" style="margin-bottom: 10px;"></div>
            <hr>
            <div class="receipt-row">
                <span>Subtotal:</span>
                <span id="displaySubtotal"></span>
            </div>
            <div class="receipt-row">
                <span>GST (18%):</span>
                <span id="displayGST"></span>
            </div>
            <hr>
            <div class="receipt-row bold">
                <span>Total Price:</span>
                <span id="displayTotalPrice"></span>
            </div>
        </div>
    </div>
    <script src="sc.js"></script>
</body>
</html>
