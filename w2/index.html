<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMI - Premium Top-Ups</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-left">
            <!-- Using a fallback text in alt in case image isn't available yet -->
            <img src="images/logo.jfif" alt="LUMI Logo" class="nav-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\'><rect width=\'40\' height=\'40\' fill=\'%232563EB\'/><text x=\'50%\' y=\'50%\' font-family=\'sans-serif\' font-size=\'20\' fill=\'white\' text-anchor=\'middle\' dominant-baseline=\'middle\'>L</text></svg>'">
            <span class="nav-title">LUMI</span>
        </a>
        <div class="nav-right">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search games...">
            <a href="cart.html" class="cart-link">
                <span>🛒 Cart</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <h1>Welcome to LUMI</h1>
        <p>Premium Top-Ups for Your Favorite Gacha Games</p>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="games-grid" id="gamesContainer">
            <!-- Games will be injected here by JS to keep HTML clean -->
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/script.js"></script>
</body>
</html>
