<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Store</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }

        .main-content {
            flex: 2;
        }

        .sidebar {
            flex: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            color: #0056b3;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
        }

        .product-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-price {
            color: #28a745;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        .cart-section, .expensive-section {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .cart-item-info h4 {
            margin: 0 0 5px 0;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-item-actions button {
            width: auto;
            padding: 2px 8px;
            background-color: #6c757d;
        }
        
        .cart-item-actions .btn-remove {
            background-color: #dc3545;
        }

        .cart-summary {
            margin-top: 15px;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 1.2em;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 5px;
        }

        .expensive-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .expensive-list li {
            background: #fdfdfe;
            border: 1px solid #dee2e6;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            color: #6c757d;
        }

        @media print {
            body { background: white; color: black; }
            .header, .main-content, .expensive-section, .cart-item-actions button, #printBtn, .footer {
                display: none !important;
            }
            .container { display: block; }
            .sidebar { width: 100%; }
            .cart-section { border: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Medical Store</h1>
        <p>Your Trusted Online Pharmacy</p>
    </div>

    <div class="container">
        <!-- Products Section -->
        <div class="main-content">
            <h2>Available Products</h2>
            <div class="products-grid" id="productsGrid">
                <!-- Products dynamically loaded here -->
            </div>
        </div>

        <!-- Sidebar (Cart & Filters) -->
        <div class="sidebar">
            <div class="cart-section">
                <h2>Your Cart</h2>
                <div id="cartItemsContainer">
                    <p style="color: #666; text-align: center;">Cart is empty</p>
                </div>
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotalAmount">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Discount:</span>
                        <span id="discountAmount" class="discount-badge">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>GST (18%):</span>
                        <span id="gstAmount">₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="totalAmount">₹0.00</span>
                    </div>
                    <p id="discountMessage" style="font-size: 12px; color: green; text-align: right; margin-top: 5px;"></p>
                    <button id="printBtn" onclick="window.print()" style="margin-top: 15px; background-color: #28a745; color: white; display: none;">Print Invoice</button>
                </div>
            </div>

            <div class="expensive-section">
                <h3>Premium Equipment (> ₹20,000)</h3>
                <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Filtered using .filter() array method</p>
                <ul class="expensive-list" id="expensiveItemsList">
                    <!-- Expensive items loaded here -->
                </ul>
            </div>
        </div>
    </div>

    <div class="footer">
        Made by Akshat Digalwar
    </div>

    <script src="pharma.js"></script>
</body>
</html>
