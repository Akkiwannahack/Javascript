<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gym Admission</h1>
        <form id="admissionForm">
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                <span class="error-msg" id="nameError">Name is required and must be at least 3 characters.</span>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <span class="error-msg" id="emailError">Please enter a valid email address.</span>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" min="10" max="100">
                <span class="error-msg" id="ageError">You must be at least 16 years old to join.</span>
            </div>

            <div class="form-group">
                <label for="membership">Membership Type:</label>
                <select id="membership" name="membership">
                    <option value="">Select a plan</option>
                    <option value="basic">Basic (₹2500/mo)</option>
                    <option value="premium">Premium (₹4000/mo)</option>
                    <option value="vip">VIP (₹6500/mo)</option>
                </select>
                <span class="error-msg" id="membershipError">Please select a membership plan.</span>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the terms and conditions</label>
                <span class="error-msg" id="termsError">You must agree to the terms.</span>
            </div>

            <button type="submit" id="submitBtn">Submit Application</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
